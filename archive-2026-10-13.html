/* ============ 渲染逻辑 ============ */
const $ = id => document.getElementById(id);
const cnt = t => OPPS.filter(o => o.tier === t).length;
$("n-focus").textContent = cnt("focus");
$("n-track").textContent = cnt("track");
$("n-policy").textContent = cnt("policy");
$("n-total").textContent = OPPS.length;
["all","focus","track","policy"].forEach(f => {
  const el = $("c-" + f);
  if (el) el.textContent = "(" + (f === "all" ? OPPS.length : cnt(f)) + ")";
});

function cardHTML(o) {
  const t = TIERS[o.tier];
  return `<div class="card" style="--tier-color:${t.color}" onclick="openDetail(${o.id})">
    <div class="head"><span class="no">${String(o.id).padStart(2,"0")}</span><span class="badge">${t.label}</span></div>
    <h3>${o.title}</h3>
    <div class="tags">${o.tags.map(x => `<span class="tag">${x}</span>`).join("")}</div>
    <p class="brief">${o.brief}</p>
    <div class="foot"><span class="src">📍 ${o.sourceDate}</span><span class="more">查看详情 →</span></div>
  </div>`;
}

function sectionHTML(key, cls) {
  const list = OPPS.filter(o => o.tier === key);
  if (!list.length) return "";
  const t = TIERS[key];
  return `<section class="sec-${key} ${cls || ""}" data-tier="${key}">
    <div class="section-head"><span class="bar"></span><h2>${t.label}</h2><span class="tip">${t.tip}</span></div>
    <p class="sec-desc">共 ${list.length} 条 · ${t.tip}</p>
    <div class="cards">${list.map(cardHTML).join("")}</div>
  </section>`;
}

function renderMain(filter) {
  if (filter === "all") {
    $("main").innerHTML = sectionHTML("focus") + sectionHTML("track") + sectionHTML("policy");
  } else {
    $("main").innerHTML = sectionHTML(filter);
  }
}
renderMain("all");

document.querySelectorAll(".chip").forEach(ch => {
  ch.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
    ch.classList.add("on");
    renderMain(ch.dataset.f);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
});

/* ============ 详情层 ============ */
function openDetail(id) {
  const o = OPPS.find(x => x.id === id);
  if (!o) return;
  const t = TIERS[o.tier];
  location.hash = "o" + id;
  const prev = OPPS.find(x => x.id === id - 1), next = OPPS.find(x => x.id === id + 1);
  $("d-badge").textContent = t.label;
  $("d-badge").style.background = t.color;
  $("d-no").textContent = "商机编号 " + String(id).padStart(2, "0") + " / " + String(OPPS.length).padStart(2, "0");
  $("d-body").innerHTML = `
    <h1>${o.title}</h1>
    <div class="d-tags">${o.tags.map(x => `<span class="tag" style="background:${t.color}1a;border-color:${t.color}44;color:${t.color}">${x}</span>`).join("")}</div>
    <div class="block" style="--tier-color:${t.color}">
      <div class="bt">📌 信息来源</div>
      <p class="src-line">来源：<b>${o.source}</b> · 发布日期：${o.sourceDate}${o.link ? ` · <a href="${o.link}" target="_blank" rel="noopener">查看原文 ↗</a>` : ""}</p>
    </div>
    <div class="block"><div class="bt">📰 事件内容</div><p>${o.event}</p></div>
    <div class="block"><div class="bt">💎 商机点分析</div><p>${o.points}</p></div>
    <div class="block"><div class="bt">🚀 电信切入建议</div><ul>${o.actions.map(a => `<li>${a}</li>`).join("")}</ul></div>
    ${o.todo ? `<div class="block"><div class="bt">⏱️ 行动时限</div><p><b style="color:${t.color}">${o.todo}</b></p></div>` : ""}
    <div class="pager">
      <button class="pg-btn" ${prev ? `onclick="openDetail(${prev.id})"` : "disabled"}><span class="dir">← 上一条</span>${prev ? prev.title.slice(0, 24) + "…" : "已是第一条"}</button>
      <button class="pg-btn" ${next ? `onclick="openDetail(${next.id})"` : "disabled"}><span class="dir" style="text-align:right;display:block">下一条 →</span>${next ? next.title.slice(0, 24) + "…" : "已是最后一条"}</button>
    </div>`;
  $("detail").classList.add("open");
  document.body.style.overflow = "hidden";
  $("detail").scrollTop = 0;
}
function closeDetail() {
  $("detail").classList.remove("open");
  document.body.style.overflow = "";
  history.replaceState(null, "", location.pathname + location.search);
}
window.addEventListener("hashchange", () => {
  const m = location.hash.match(/^#o(\d+)$/);
  if (m) openDetail(parseInt(m[1]));
  else if ($("detail").classList.contains("open")) closeDetail();
});
(function initFromHash() {
  const m = location.hash.match(/^#o(\d+)$/);
  if (m) openDetail(parseInt(m[1]));
})();
