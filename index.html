function cardHTML(o) {

function sectionHTML(key) {
  const list = OPPS.filter(o => o.tier === key);

  return `<section class="sec-${key}" data-tier="${key}">

    <div class="cards">${list.map(cardHTML).join("")}</div>
  </section>`;
}

function openDetail(id) {
  const o = OPPS.find(x => x.id === id);
  if (!o) return;
  const t = TIERS[o.tier];
  location.hash = "o" + id;
  const prev = OPPS.find(x => x.id === id - 1), next = OPPS.find(x => x.id === id + 1);
  $("d-badge").textContent = t.label;
  $("d-badge").style.background = t.color;
  $("d-no").textContent = "商机编号 " + String(id).padStart(2, "0") + " / " + String(OPPS.length).padStart(2, "0");
  $("d-body").innerHTML = `
    <h1>${o.title}</h1>
    <div class="d-tags">${o.tags.map(x => `<span class="tag" style="background:${t.color}1a;border-color:${t.color}44;color:${t.color}">${x}</span>`).join("")}</div>
    <div class="block" style="--tier-color:${t.color}">
      <div class="bt">📌 信息来源</div>
      <p class="src-line">来源：<b>${o.source}</b> · 发布日期：${o.sourceDate}${o.link ? ` · <a href="${o.link}" target="_blank" rel="noopener">查看原文 ↗</a>` : ""}</p>
    </div>
    <div class="block"><div class="bt">📰 事件内容</div><p>${o.event}</p></div>
    <div class="block"><div class="bt">💎 商机点分析</div><p>${o.points}</p></div>
    <div class="block"><div class="bt">🚀 电信切入建议</div><ul>${o.actions.map(a => `<li>${a}</li>`).join("")}</ul></div>
    ${o.todo ? `<div class="block"><div class="bt">⏱️ 行动时限</div><p><b style="color:${t.color}">${o.todo}</b></p></div>` : ""}
    <div class="pager">
      <button class="pg-btn" ${prev ? `onclick="openDetail(${prev.id})"` : "disabled"}><span class="dir">← 上一条</span>${prev ? prev.title.slice(0, 24) + "…" : "已是第一条"}</button>
      <button class="pg-btn" ${next ? `onclick="openDetail(${next.id})"` : "disabled"}><span class="dir" style="text-align:right;display:block">下一条 →</span>${next ? next.title.slice(0, 24) + "…" : "已是最后一条"}</button>
    </div>`;
  $("detail").classList.add("open");
  document.body.style.overflow = "hidden";
  $("detail").scrollTop = 0;
}
function closeDetail() {
  $("detail").classList.remove("open");
  document.body.style.overflow = "";
  history.replaceState(null, "", location.pathname + location.search);
}
window.addEventListener("hashchange", () => {
  const m = location.hash.match(/^#o(\d+)$/);
  if (m) openDetail(parseInt(m[1]));
  else if ($("detail").classList.contains("open")) closeDetail();
});
(function initFromHash() {
  const m = location.hash.match(/^#o(\d+)$/);
  if (m) openDetail(parseInt(m[1]));
})();

function issueHref(it) { const v = it.date.replace(/-/g, ""); return it.latest ? "index.html?v=" + v : "archive-" + it.date + ".html?v=" + v; }
function currentIssue() {
  const m = location.pathname.match(/archive-(\d{4}-\d{2}-\d{2})\.html/);
  if (m) { const hit = ISSUES.find(i => i.date === m[1]); if (hit) return hit; }
  return ISSUES.find(i => i.latest) || ISSUES[0];
}
function jumpToDate() { const sel = $("dateSelect"); const it = ISSUES.find(i => i.date === sel.value); if (it) location.href = issueHref(it); }

(function renderSummary() {
  const cur = currentIssue();
  const sum = { issues: ISSUES.length, total: 0, focus: 0, track: 0, policy: 0 };
  ISSUES.forEach(i => { sum.total += i.total; sum.focus += i.focus; sum.track += i.track; sum.policy += i.policy; });
  $("sumDesc").textContent = "当前浏览：第 " + cur.issue + " 期（" + cur.date + "）· 已累计发布 " + sum.issues + " 期 · 累计线索 " + sum.total + " 条次（含跨期跟踪更新项）";
  $("sumGrid").innerHTML = [

  ].map(a => `<div class="sum-card ${a[0]}"><div class="num">${a[1]}</div><div class="lbl">${a[2]}</div></div>`).join("");

  const maxT = Math.max(...ISSUES.map(i => i.total));
  $("trendRows").innerHTML = ISSUES.map(i => {
    const pct = n => (n / maxT * 100).toFixed(1);
    return `<div class="trend-row ${i.date === cur.date ? "current" : ""}" onclick="location.href='${issueHref(i)}'">
      <div class="tr-label">第 ${i.issue} 期<small>${i.date}</small></div>
      <div class="tr-bar"><span class="bar-seg" style="width:${pct(i.focus)}%;background:#C00000"></span><span class="bar-seg" style="width:${pct(i.track)}%;background:#d96a00"></span><span class="bar-seg" style="width:${pct(i.policy)}%;background:#4a5f85"></span></div>
      <div class="tr-num"><b style="color:var(--ink)">${i.total}</b> 条</div>
    </div>`;
  }).join("");

  const today = new Date(); today.setHours(0, 0, 0, 0);
  $("dlList").innerHTML = DEADLINES.map(d => {
    const dl = Math.round((new Date(d.d + "T00:00:00") - today) / 86400000);
    let cls = "ok", txt = "剩 " + dl + " 天";
    if (dl < 0) { cls = "past"; txt = "已截止"; }
    else if (dl === 0) { cls = "hot"; txt = "⚠️ 今日截止"; }
    else if (dl <= 7) { cls = "hot"; txt = "剩 " + dl + " 天"; }
    else if (dl <= 30) { cls = "warn"; txt = "剩 " + dl + " 天"; }
    return `<div class="dl-item ${dl < 0 ? "past" : ""}"><div class="dl-t">${d.t}<small>${d.d} · ${d.s}</small></div><span class="dl-badge ${cls}">${txt}</span></div>`;
  }).join("");

  $("dateSelect").innerHTML = ISSUES.map(i => `<option value="${i.date}" ${i.date === cur.date ? "selected" : ""}>${i.date}（第 ${i.issue} 期 · ${i.total} 条线索）${i.latest ? " · 最新" : ""}</option>`).join("");
  $("archGrid").innerHTML = ISSUES.map(i => {
    const flags = [];
    if (i.latest) flags.push('<span class="ac-flag new">最新</span>');

})();
