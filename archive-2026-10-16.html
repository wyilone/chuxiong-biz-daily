    <div class="pager">

    return `<div class="trend-row ${i.date === cur.date ? "current" : ""}" onclick="location.href='${issueHref(i)}'">
      <div class="tr-label">第 ${i.issue} 期<small>${i.date}</small></div>
      <div class="tr-bar"><span class="bar-seg" style="width:${pct(i.focus)}%;background:#C00000"></span><span class="bar-seg" style="width:${pct(i.track)}%;background:#d96a00"></span><span class="bar-seg" style="width:${pct(i.policy)}%;background:#4a5f85"></span></div>
      <div class="tr-num"><b style="color:var(--ink)">${i.total}</b> 条</div>
    </div>`;
  }).join("");

  const today = new Date(); today.setHours(0, 0, 0, 0);
  $("dlList").innerHTML = DEADLINES.map(d => {
    const dl = Math.round((new Date(d.d + "T00:00:00") - today) / 86400000);
    let cls = "ok", txt = "剩 " + dl + " 天";
    if (dl < 0) { cls = "past"; txt = "已截止"; }
    else if (dl === 0) { cls = "hot"; txt = "⚠️ 今日截止"; }
    else if (dl <= 7) { cls = "hot"; txt = "剩 " + dl + " 天"; }
    else if (dl <= 30) { cls = "warn"; txt = "剩 " + dl + " 天"; }
    return `<div class="dl-item ${dl < 0 ? "past" : ""}"><div class="dl-t">${d.t}<small>${d.d} · ${d.s}</small></div><span class="dl-badge ${cls}">${txt}</span></div>`;
  }).join("");

  $("dateSelect").innerHTML = ISSUES.map(i => `<option value="${i.date}" ${i.date === cur.date ? "selected" : ""}>${i.date}（第 ${i.issue} 期 · ${i.total} 条线索）${i.latest ? " · 最新" : ""}</option>`).join("");
  $("archGrid").innerHTML = ISSUES.map(i => {
    const flags = [];
    if (i.latest) flags.push('<span class="ac-flag new">最新</span>');
    if (i.date === cur.date) flags.push('<span class="ac-flag cur">正在浏览</span>');
    return `<div class="arch-card ${i.date === cur.date ? "current" : ""}" onclick="location.href='${issueHref(i)}'">
      <div class="ac-top"><span class="ac-issue">第 ${i.issue} 期</span><span class="ac-date">${i.date}</span>${flags.join("")}</div>
      <div class="ac-stats">🔴 ${i.focus} · 🟠 ${i.track} · 🔵 ${i.policy} · 共 <b>${i.total}</b> 条</div>
      <div class="ac-note">${i.highlights}</div>
      <div class="ac-go">查看完整看板 →</div>
    </div>`;
  }).join("");
})();

/* ============ 附录 ============ */
$("foot").innerHTML = `
  <div class="section-head"><span class="bar" style="background:#2f7d4f"></span><h2 style="color:#2f7d4f">上期（第3期）跟踪进展</h2></div>
  <div class="block" style="--tier-color:#2f7d4f"><ul>${FOLLOW_UP.map(f => `<li>${f}</li>`).join("")}</ul></div>
  <div class="section-head" style="margin-top:34px"><span class="bar"></span><h2>附录：本期信息来源</h2></div>
  <table class="src-table">
    <tr><th style="width:30%">来源</th><th>本期采用的栏目/内容</th></tr>
    ${SOURCES.map(s => `<tr><td><b>${s[0]}</b></td><td>${s[1]}</td></tr>`).join("")}
  </table>
  <p class="note">本报告由智能体自动采集公开信息整理生成，商机判断仅供参考<br>行动前请以官方正式文件和采购公告为准 · 每日更新</p>`;
</script>
</body>
